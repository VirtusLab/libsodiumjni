name: CI
on:
  pull_request:
  push:
    branches:
    - main
    tags:
    - "v*"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-latest
            platform: windows
          - os: windows-11-arm
            platform: windows-aarch64
          - os: macos-latest
            platform: mac-aarch64
          - os: macos-15-intel
            platform: mac-intel
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v9
    - uses: VirtusLab/scala-cli-setup@v1
      if: matrix.platform != 'windows-aarch64'
      with:
        jvm: zulu:17
    # Mill and the tests must run on a native arm64 JVM there, so that the native library is built
    # for arm64 (setup-java picks the runner architecture by default)
    - uses: actions/setup-java@v6
      if: matrix.platform == 'windows-aarch64'
      with:
        distribution: zulu
        java-version: 17
    - name: Run tests
      run: ./mill -i __.test
    - name: Check that the build didn't modify tracked files
      # e.g. the JNI header generated by javac -h, which must be committed along with the native
      # methods it declares (skipped on Windows, where generated headers get CRLF line endings)
      if: runner.os != 'Windows'
      shell: bash
      run: git diff --exit-code
    - name: Build and publish locally
      run: ./mill -i __.publishLocal
    - name: List published files
      shell: bash
      run: find ~/.ivy2/local | sort
    - name: Copy artifacts
      run: ./mill -i __.jniCopyFilesTo --dest artifacts/
    - uses: actions/upload-artifact@v7
      with:
        name: artifacts-${{ matrix.platform }}
        path: artifacts/
        if-no-files-found: error
        retention-days: 2

  check-release-natives:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v9
      - uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: zulu:17
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-linux
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-linux-aarch64
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-windows
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-windows-aarch64
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-mac-intel
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-mac-aarch64
          path: artifacts/
      - name: Check native libraries of the release
        run: |
          ./mill -i libsodiumjni.jar
          .github/scripts/check-release-natives.sh out/libsodiumjni/jar.dest/out.jar artifacts/

  release:
    needs: [test, check-release-natives]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v9
      - uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: zulu:17
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-linux
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-linux-aarch64
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-windows
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-windows-aarch64
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-mac-intel
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-mac-aarch64
          path: artifacts/
      - run: .github/scripts/gpg-setup.sh
        shell: bash
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
      - name: Release
        run: ./mill -i publishSonatype --tasks __.publishArtifacts
        env:
          PGP_PASSWORD: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
